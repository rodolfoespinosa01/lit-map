services:
  logger.channel.lit_contribution:
    parent: logger.channel_base
    arguments: ['lit_contribution']
  lit_contribution.validator:
    class: Drupal\lit_contribution\Service\SubmissionValidator
    arguments: ['%app.root%']
  lit_contribution.mock_source:
    class: Drupal\lit_contribution\Source\MockQualtricsSource
    arguments: ['%app.root%', '@lit_contribution.validator']
  lit_contribution.reviews:
    class: Drupal\lit_contribution\Service\ReviewManager
    arguments: ['@database', '@lit_contribution.source', '@lit_contribution.validator', '@current_user', '@private_key', '@lock']
  lit_contribution.writer:
    class: Drupal\lit_contribution\Service\AtomicAggregateWriter
    arguments: ['%app.root%']
  lit_contribution.publication:
    class: Drupal\lit_contribution\Service\Publication
    arguments: ['@database', '@lit_contribution.source', '@lit_contribution.validator', '@lit_contribution.reviews', '@lit_contribution.writer', '@lit_map.survey_normalizer', '@current_user']
  lit_contribution.invitation:
    class: Drupal\lit_contribution\Service\Invitation
    arguments: ['@config.factory']
  lit_contribution.private_responses:
    class: Drupal\lit_contribution\EventSubscriber\PrivateResponseSubscriber
    tags:
      - { name: event_subscriber }
  lit_contribution.owner:
    class: Drupal\lit_contribution\Service\OwnerAccess
  lit_contribution.passwordless:
    class: Drupal\lit_contribution\Service\PasswordlessLogin
    arguments: ['@lit_contribution.owner']
  lit_contribution.resources:
    class: Drupal\lit_contribution\Service\ResourceCatalog
    arguments: ['@config.factory', '@entity_type.manager', '@lit_contribution.validator']
  lit_contribution.password_login:
    class: Drupal\lit_contribution\Service\PasswordLogin
    arguments: ['@lit_contribution.owner']
  lit_contribution.superadmin_bootstrap:
    class: Drupal\lit_contribution\Service\SuperadminBootstrap
    arguments: ['@lit_contribution.owner']
  lit_contribution.managed_passwords:
    class: Drupal\lit_contribution\EventSubscriber\ManagedPasswordSubscriber
    tags:
      - { name: event_subscriber }

  lit_contribution.export_store:
    class: Drupal\lit_contribution\Service\ExportStore
    arguments: ['%app.root%', '@database']
  lit_contribution.source:
    class: Drupal\lit_contribution\Source\PublishedBaselineAndExports
    arguments: ['@lit_contribution.mock_source', '@lit_contribution.export_store', '@lit_contribution.validator']
  lit_contribution.export_mapper:
    class: Drupal\lit_contribution\Source\NormalizedExportMapper
  lit_contribution.importer:
    class: Drupal\lit_contribution\Service\ExportImporter
    arguments: ['@database', '@lit_contribution.export_store', '@lit_contribution.validator', '@lit_contribution.reviews']
  lit_contribution.local_source:
    class: Drupal\lit_contribution\Source\LocalDemoSourceAdapter
    arguments: ['@lit_contribution.importer']
