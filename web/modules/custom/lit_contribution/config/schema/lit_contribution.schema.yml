lit_contribution.settings:
  type: config_object
  label: 'LiT contribution invitation'
  mapping:
    contribution_mode:
      type: string
      label: Contribution mode
    panel_threshold:
      type: integer
      label: Minimum answered-response threshold
    invitation_enabled:
      type: boolean
      label: 'Show invitation'
    survey_url:
      type: string
      label: 'Configured HTTPS Qualtrics survey URL'

lit_contribution.resources:
  type: config_object
  label: LiT editorial resources
  mapping:
    catalog_json:
      type: string
      label: Validated version-1 resource catalogue JSON
